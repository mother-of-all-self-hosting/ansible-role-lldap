---
- name: Verify LLDAP
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the checks shared by all LLDAP scenarios
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

    # Pointing `lldap_database_type` at `postgres` is only worth testing if it
    # actually moves the data. Asking Postgres itself for the user that was
    # created over GraphQL is what settles that; a `LLDAP_DATABASE_URL` in the
    # env file would look just as convincing while LLDAP quietly kept using
    # SQLite.
    - name: Read the users LLDAP stored, out of the Postgres database
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "--env=PGPASSWORD={{ postgres_connection_password }}"
          - "{{ postgres_identifier }}"
          - psql
          - "--username={{ postgres_connection_username }}"
          - "--dbname={{ lldap_database_name }}"
          - --tuples-only
          - --no-align
          - "--command=SELECT user_id FROM users ORDER BY user_id"
      register: lldap_postgres_users
      changed_when: false

    - name: Assert that the Postgres database holds both users
      ansible.builtin.assert:
        that: >-
          lldap_postgres_users.stdout_lines | sort
          ==
          [lldap_environment_variables_lldap_ldap_user_dn, lldap_molecule_probe_username] | sort
        fail_msg: >-
          The `{{ lldap_database_name }}` database holds {{ lldap_postgres_users.stdout_lines }},
          not the admin user and `{{ lldap_molecule_probe_username }}`
        success_msg: "The `{{ lldap_database_name }}` Postgres database holds both users"

    - name: Check whether LLDAP also wrote a SQLite database
      ansible.builtin.stat:
        path: "{{ lldap_molecule_sqlite_path }}"
      register: lldap_sqlite_file

    # The counterpart of the check above: LLDAP falling back to SQLite while
    # Postgres happened to be reachable would leave both stores populated and
    # the assertion above still green.
    - name: Assert that LLDAP did not fall back to SQLite
      ansible.builtin.assert:
        that: not lldap_sqlite_file.stat.exists
        fail_msg: "LLDAP wrote a SQLite database at `{{ lldap_molecule_sqlite_path }}` despite being pointed at Postgres"
        success_msg: "LLDAP wrote no SQLite database, so Postgres is its only store"
