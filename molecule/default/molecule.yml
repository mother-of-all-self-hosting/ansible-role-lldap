---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: lldap-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        lldap_debug_service_enabled: false
        # The user that verify.yml creates over the GraphQL API and then looks
        # for over LDAP. It must not be one LLDAP creates by itself.
        lldap_molecule_probe_username: molecule-probe
        # Where the SQLite database would land, if this scenario used one.
        lldap_molecule_sqlite_path: /lldap/data/users.db

        # Variables for LLDAP
        lldap_uid: 1000
        lldap_gid: 1000
        lldap_scheme: http
        lldap_hostname: localhost
        lldap_container_labels_traefik_enabled: false
        lldap_container_http_host_bind_port: 17170
        lldap_container_ldap_host_bind_port: 3890
        lldap_environment_variables_lldap_jwt_secret: jwtsecret
        lldap_environment_variables_lldap_key_seed: keyseed
        lldap_environment_variables_lldap_ldap_user_dn: username
        lldap_environment_variables_lldap_ldap_user_pass: password
        # Deliberately not the role's default base DN, so that binding under
        # it proves the role passed this value through to the server.
        lldap_environment_variables_lldap_ldap_base_dn: dc=molecule,dc=example,dc=com
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
