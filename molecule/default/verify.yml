---
- name: Verify LLDAP
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the checks shared by all LLDAP scenarios
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/resources/tasks/verify_lldap.yml"

    # This scenario leaves `lldap_database_type` at its `sqlite` default, so
    # the store has to be the file LLDAP keeps in its data directory. Reading
    # the probe user straight out of that file - rather than trusting the
    # `LLDAP_DATABASE_URL` we wrote into the env file - is what proves SQLite
    # is the backend actually carrying the data.
    - name: Read the users LLDAP stored, out of its SQLite database
      ansible.builtin.command:
        argv:
          - python3
          - "-c"
          - |
            import sqlite3
            import sys

            connection = sqlite3.connect('file:%s?mode=ro' % sys.argv[1], uri=True)
            print(','.join(row[0] for row in connection.execute('SELECT user_id FROM users ORDER BY user_id')))
          - "{{ lldap_molecule_sqlite_path }}"
      register: lldap_sqlite_users
      changed_when: false

    - name: Assert that the SQLite database holds both users
      ansible.builtin.assert:
        that: >-
          lldap_sqlite_users.stdout.split(',') | sort
          ==
          [lldap_environment_variables_lldap_ldap_user_dn, lldap_molecule_probe_username] | sort
        fail_msg: >-
          `{{ lldap_molecule_sqlite_path }}` holds `{{ lldap_sqlite_users.stdout }}`,
          not the admin user and `{{ lldap_molecule_probe_username }}`
        success_msg: "The SQLite database at `{{ lldap_molecule_sqlite_path }}` holds both users"
