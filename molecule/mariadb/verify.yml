---
- name: Verify LLDAP
  hosts: all
  become: true
  gather_facts: false

  vars:
    lldap_verify_units:
      - lldap.service
      - mariadb.service

  tasks:
    - name: Verify that LLDAP works
      block:
        - name: Run the checks shared by all LLDAP scenarios
          ansible.builtin.include_tasks:
            file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

        # Verify LLDAP stores data on the database actually by asking MariaDB itself for the user that was
        # created over GraphQL.
        - name: Read the users LLDAP stored, out of the MariaDB database
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - "--env=MYSQL_PWD={{ mariadb_root_password }}"
              - "{{ mariadb_identifier }}"
              - mariadb
              - "--user=root"
              - --batch
              - --skip-column-names
              - "--execute=SELECT user_id FROM users ORDER BY user_id"
              - "{{ lldap_database_name }}"
          register: lldap_mariadb_users
          changed_when: false

        - name: Assert that the MariaDB database holds both users
          ansible.builtin.assert:
            that: >-
              lldap_mariadb_users.stdout_lines | sort
              ==
              [lldap_environment_variables_lldap_ldap_user_dn, lldap_molecule_probe_username] | sort
            fail_msg: >-
              The `{{ lldap_database_name }}` database holds {{ lldap_mariadb_users.stdout_lines }},
              not the admin user and `{{ lldap_molecule_probe_username }}`
            success_msg: "The `{{ lldap_database_name }}` MariaDB database holds both users"

        - name: Check whether LLDAP also wrote a SQLite database
          ansible.builtin.stat:
            path: "{{ lldap_molecule_sqlite_path }}"
          register: lldap_sqlite_file

        # The counterpart of the check above: LLDAP falling back to SQLite while
        # MariaDB happened to be reachable would leave both stores populated and
        # the assertion above still green.
        - name: Assert that LLDAP did not fall back to SQLite
          ansible.builtin.assert:
            that: not lldap_sqlite_file.stat.exists
            fail_msg: "LLDAP wrote a SQLite database at `{{ lldap_molecule_sqlite_path }}` despite being pointed at MariaDB"
            success_msg: "LLDAP wrote no SQLite database, so MariaDB is its only store"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "lldap_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: lldap_restarts_before
              loop: "{{ lldap_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: lldap_restarts_after
              loop: "{{ lldap_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - lldap_restarts_after.results | map(attribute='status.NRestarts') | list == lldap_restarts_before.results | map(attribute='status.NRestarts') | list
                  - lldap_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in lldap_verify_units | zip(lldap_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in lldap_verify_units | zip(lldap_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in lldap_verify_units | zip(lldap_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the LLDAP verification summary
          ansible.builtin.debug:
            msg:
              - "LLDAP systemd: {% for unit, state in lldap_verify_units | zip(lldap_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "LLDAP restarts: {% for unit, restarts in lldap_verify_units | zip(lldap_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "LLDAP version: {{ lldap_version_reported.stdout }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the LLDAP systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=lldap.service
          register: lldap_service_log
          changed_when: false

        - name: Show the LLDAP systemd service log
          ansible.builtin.debug:
            var: lldap_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "LLDAP verification failed. The systemd service log is printed above."
