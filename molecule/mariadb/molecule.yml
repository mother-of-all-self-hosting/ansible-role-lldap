---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: lldap-${MOLECULE_DISTRO:-ubuntu2604}-mariadb
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        lldap_debug_service_enabled: false

        # Variables for LLDAP
        lldap_uid: 1000
        lldap_gid: 1000
        lldap_scheme: http
        lldap_hostname: localhost
        lldap_container_labels_traefik_enabled: false
        lldap_container_http_host_bind_port: 17170
        lldap_environment_variables_lldap_jwt_secret: jwtsecret
        lldap_environment_variables_lldap_key_seed: keyseed
        lldap_environment_variables_lldap_ldap_user_dn: username
        lldap_environment_variables_lldap_ldap_user_pass: password

        # Variables required for LLDAP to connect to the MariaDB database (via Unix socket)
        lldap_database_type: mysql
        lldap_database_mysql_username: my_database_username
        lldap_database_mysql_password: my_database_password
        lldap_database_name: lldap
        lldap_database_mysql_socket_enabled: true
        lldap_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
        lldap_systemd_required_services_list_auto: |
          {{
            (['mariadb.service'])
          }}

        # Variables for MariaDB
        mariadb_uid: 1000
        mariadb_gid: 1000
        mariadb_root_password: mariadb_password
        mariadb_container_unix_socket_enabled: true
        mariadb_managed_databases: |
          {{
            [{
              'name': lldap_database_name,
              'username': lldap_database_mysql_username,
              'password': lldap_database_mysql_password,
            }]
          }}
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-mariadb
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
